function qs(id){return document.getElementById(id);}
function ce(tag,cls,html){var el=document.createElement(tag);if(cls)el.className=cls;if(html)el.innerHTML=html;return el;}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});qs(id).classList.add('active');}
function rFlash(){var f=qs('rf');f.style.opacity='1';setTimeout(function(){f.style.opacity='0';},110);}

function doTrans(txt,cb,ms){
  ms=ms||1300;
  qs('ttxt').textContent=txt;
  qs('tov').classList.add('show');
  setTimeout(function(){if(cb)cb();setTimeout(function(){qs('tov').classList.remove('show');},550);},ms);
}

var G={level:0,inv:[],flags:{},keys:{},px:400,py:300,pdir:'south',pmoving:false,pframe:0,pfT:0,paused:false,nearObj:null,dlgOpen:false,dlgCb:null,typeIv:null,plgIv:null};
var objects=[], dlgQ=[], dlgActive=false;
var papersFound=0, foundDrawings=[], boardState=[null,null,null,null,null], selCard=null;
var wallsRead={}, candlesOut=[], pIdx=0;

document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  G.keys[k]=true;
  if(k==='e'){handleInteract();}
  if(k===' '||k==='enter'){e.preventDefault();if(G.dlgOpen)advanceDlg();}
});
document.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});

function dlg(lines,onDone){
  dlgQ=[];
  for(var i=0;i<lines.length;i++){
    dlgQ.push({speaker:lines[i].speaker,text:lines[i].text,cb:i===lines.length-1?onDone:null});
  }
  dlgActive=false;
  nextDlg();
}
function nextDlg(){
  if(!dlgQ.length){closeDlg();dlgActive=false;return;}
  dlgActive=true;G.paused=true;
  var item=dlgQ.shift();
  openDlgFrame(item.speaker,item.text);
  logEntry(item.speaker,item.text);
  G.dlgCb=item.cb||null;
}
function openDlgFrame(speaker,text){
  qs('dlgSpk').textContent=speaker;
  var el=qs('dlgTxt');el.textContent='';
  qs('dlgBox').classList.add('open');
  G.dlgOpen=true;
  clearInterval(G.typeIv);
  var i=0;
  G.typeIv=setInterval(function(){if(i<text.length)el.textContent+=text[i++];else clearInterval(G.typeIv);},20);
}
function closeDlg(){qs('dlgBox').classList.remove('open');G.dlgOpen=false;G.paused=false;}
function advanceDlg(){
  if(!G.dlgOpen)return;
  clearInterval(G.typeIv);
  var cb=G.dlgCb;G.dlgCb=null;
  if(dlgQ.length){nextDlg();if(cb)cb();}
  else{closeDlg();dlgActive=false;if(cb)cb();}
}
function handleInteract(){if(G.dlgOpen){advanceDlg();return;}if(G.nearObj&&G.nearObj.onInteract)G.nearObj.onInteract();}
function handleExamine(){if(G.dlgOpen)return;if(G.nearObj&&G.nearObj.onExamine)G.nearObj.onExamine();else if(G.nearObj&&G.nearObj.onInteract)G.nearObj.onInteract();}

function logEntry(speaker,text){
  var area=qs('storyLog');
  var d=ce('div','animate-fadeUp');
  var cols={ELIAS:'text-candle',HERNANDO:'text-pink-300/80',ANN:'text-emerald-300/80',UNKNOWN:'text-blue-300/70'};
  if(speaker==='NARRATION'){
    d.innerHTML='<p class="font-body italic text-sm leading-relaxed text-white border-l-2 border-candle pl-2">'+text+'</p>';
  } else {
    var c=cols[speaker]||'text-candle';
    d.innerHTML='<div class="font-title text-xs tracking-[0.2em] '+c+' mb-0.5">'+speaker+'</div><p class="font-body text-base leading-relaxed text-white/95">'+text+'</p>';
  }
  area.appendChild(d);
  setTimeout(function(){area.scrollTop=area.scrollHeight;},35);
}
function clearLog(){qs('storyLog').innerHTML='';}

var SPEED=2.6;
function ww(){return qs('wWrap').clientWidth;}
function wh(){return qs('wWrap').clientHeight;}
var lastT=0;
function loop(ts){
  var dt=Math.min(ts-lastT,48);lastT=ts;
  if(G.level>0&&!G.paused){
    var dx=0,dy=0;
    var up=G.keys['w']||G.keys['arrowup'];
    var dn=G.keys['s']||G.keys['arrowdown'];
    var lt=G.keys['a']||G.keys['arrowleft'];
    var rt=G.keys['d']||G.keys['arrowright'];
    if(up){dy=-SPEED;}
    if(dn){dy=SPEED;}
    if(lt){dx=-SPEED;}
    if(rt){dx=SPEED;}
    
    if(up&&rt)G.pdir='northeast';
    else if(up&&lt)G.pdir='northwest';
    else if(dn&&rt)G.pdir='southeast';
    else if(dn&&lt)G.pdir='southwest';
    else if(up)G.pdir='north';
    else if(dn)G.pdir='south';
    else if(lt)G.pdir='west';
    else if(rt)G.pdir='east';
    G.pmoving=(dx!==0||dy!==0);
    if(G.pmoving){
      var minY=wh()*0.28,maxY=wh()*0.87;
      G.px=Math.max(18,Math.min(ww()-18,G.px+dx));
      G.py=Math.max(minY,Math.min(maxY,G.py+dy));
      G.pfT+=dt;if(G.pfT>115){G.pframe=(G.pframe+1)%4;G.pfT=0;}
    }
    var pl=qs('player');
    pl.style.left=(G.px-55)+'px';pl.style.top=(G.py-220)+'px';
    pl.style.zIndex=Math.floor(G.py);
    renderPlayer();
    G.nearObj=getNear();
    updateHint();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(function(t){lastT=t;loop(t);});

function updateHint(){
  var ring=qs('iRing'),lbl=qs('pLabel');

    lbl.style.left=cx+'px';lbl.style.top=(cy-30)+'px';lbl.classList.remove('hidden');
    lbl.querySelector('div').textContent='[E] '+G.nearObj.label;
  } else {ring.classList.add('hidden');lbl.classList.add('hidden');}
}

          cimg.style.cssText='height:55px;object-fit:contain;margin-bottom:2px;';
          cimg.onerror=function(){this.style.display='none';};
          var fl=cd.querySelector('.flame');
          if(fl){cd.insertBefore(cimg,fl);fl.style.display='none';}
          else cd.insertBefore(cimg,cd.firstChild);
        }
      })(ci);
    }
  },200);
  addObj({id:'note',x:18,y:H*0.24,w:142,h:205,label:'Read the note',html:'',
    onInteract:function(){dlg([{speaker:'ELIAS',text:'(reading) "Extinguish the candles. Void. Moon. Eye. Hand. Flame. In that order."'},{speaker:'ELIAS',text:"He wrote this for me. He always knew I'd come."}]);},
    onExamine:function(){dlg([{speaker:'ELIAS',text:"Papa's handwriting. He left this for me."}]);}});
  var cpHtml='';
  for(var i=0;i<CNAMES.length;i++)cpHtml+='<div id="cp'+i+'" class="px-1.5 py-0.5 font-title text-[0.65rem] tracking-wider border border-parchment/30 text-white/95">'+CNAMES[i]+'</div>';
  setPuzzle('<div class="font-title text-candle text-[0.7rem] tracking-[0.3em] uppercase mb-1.5">RITUAL CANDLES</div>'
    +'<p class="font-body italic text-white/95 text-sm mb-2">Read the wall note, then: Void → Moon → Eye → Hand → Flame</p>'
    +'<div class="flex gap-1 flex-wrap" id="cProg">'+cpHtml+'</div>'
    +pFb('rcfb'));
  dlg([
    {speaker:'NARRATION',text:'Elias enters. Hernando stands at the center of a circle. Candles everywhere.'},
    {speaker:'HERNANDO',text:"I knew you'd come eventually."},
    {speaker:'ELIAS',text:'Papa. Look at yourself.'},
    {speaker:'HERNANDO',text:'You look like your mother. I forgot that.'},
    {speaker:'ELIAS',text:'We need to leave. Right now.'},
    {speaker:'HERNANDO',text:"I'm not leaving. I'm close."},
    {speaker:'HERNANDO',text:'Bringing Ann home.'},
    {speaker:'ELIAS',text:"Papa. The ritual is wrong."},
    {speaker:'HERNANDO',text:"I know. But I have nothing else left."},
    {speaker:'ELIAS',text:'You still have me, Papa.'},
    {speaker:'HERNANDO',text:"(quietly) There's a note on the wall. Read it. Do what it says. Please."},
  ]);
}
function doExtinguish(i,name){
  var exp=CNAMES[candlesOut.length];
  if(name!==exp){var prev=candlesOut.length>0?candlesOut[candlesOut.length-1]:'nothing';setFb('rcfb',"That's not right. The ritual collapses...",false);rFlash();setTimeout(function(){startLevel(4);},1200);return;}
  candlesOut.push(name);
  var cd=qs('cd'+i);
  if(cd){
    var cimgEl=qs('cimg'+i);
    var COUT=[A.C_VOID_OUT,A.C_MOON_OUT,A.C_EYE_OUT,A.C_HAND_OUT,A.C_FLAME_OUT];
    if(cimgEl&&COUT[i]){cimgEl.src=COUT[i];}
    else{var fl=cd.querySelector('.flame');if(fl)fl.remove();}
    cd.style.opacity='0.4';
    cd.style.filter='grayscale(0.7)';
  }
  var o=null;for(var j=0;j<objects.length;j++){if(objects[j].id==='c'+i){o=objects[j];break;}}
  if(o)o.collected=true;
  var cp=qs('cp'+i);if(cp)cp.className='px-1.5 py-0.5 font-title text-[0.5rem] tracking-wider border border-candle/38 text-candle line-through';
  dlg([{speaker:'ELIAS',text:name[0]+name.slice(1).toLowerCase()+'.'}]);
  if(name==='EYE')dlg([{speaker:'HERNANDO',text:"(quietly) I just wanted to hear her laugh one more time. That's all I wanted."}]);
  if(name==='FLAME'){
    setFb('rcfb','The circle goes dark. The candles die.',true);
    dlg([{speaker:'ELIAS',text:"(quietly) I'm going to tell you everything you forgot, Papa. Every single thing. I promise."}],function(){setTimeout(endingSequence,700);});
  } else {
    setFb('rcfb',candlesOut.length+' of 5. Next: '+CNAMES[candlesOut.length],true);
  }
}

function endingSequence(){
  showScreen('scrGame');clearLog();
  setRoom('re','EPILOGUE','OUTSIDE — MORNING');setBgImg(A.BG_ABANDONED,0.25);
  G.px=ww()*0.4;G.py=wh()*0.72;
  clearObjects();clearPuzzle();
  var grassSvg='<rect x="0" y="0" width="900" height="600" fill="#060d04"/>'

  for(var i=0;i<55;i++){grassSvg+='<rect x="'+(i*17+Math.sin(i)*5)+'" y="'+(438+Math.sin(i*0.7)*16)+'" width="2" height="'+(7+Math.cos(i)*4)+'" fill="rgba(35,72,18,0.48)" rx="1"/>';}
  setDeco(grassSvg
    +'<circle cx="375" cy="400" r="3" fill="rgba(195,215,95,0.68)" style="filter:blur(1px)"/>'
    +'<circle cx="525" cy="382" r="2" fill="rgba(195,215,95,0.52)" style="filter:blur(1px)"/>'
    +'<circle cx="612" cy="395" r="2" fill="rgba(195,215,95,0.45)" style="filter:blur(1px)"/>');
  addNPC('hernando2',ww()*0.33,wh()*0.72,'#3a2535','HERNANDO','hernando');
  addNPC('ann',ww()*0.60,wh()*0.72,'#1a3545','ANN','ann');
  dlg([
    {speaker:'NARRATION',text:'Hernando collapses. Elias catches him.'},
    {speaker:'ELIAS',text:'PAPA!'},
    {speaker:'NARRATION',text:'Then — a faint light from the center of the broken circle.'},
    {speaker:'NARRATION',text:'Ann steps out. Not a ghost. Not a remnant. Just Ann. Small. Ten years old. Exactly as she was.'},
    {speaker:'ANN',text:'Elias?'},
    {speaker:'ELIAS',text:'(voice breaking) Ann.'},
    {speaker:'ANN',text:'(running to him) You came back.'},
    {speaker:'ELIAS',text:"I came back. I'm sorry it took so long. I'm so sorry."},
    {speaker:'ANN',text:"(to Hernando) Papa. It's me. It's Ann."},
    {speaker:'HERNANDO',text:"(eyes opening) I can't see your face clearly anymore. They took that from me."},
    {speaker:'ANN',text:'(squeezing his hand) Then look harder.'},
    {speaker:'HERNANDO',text:'(whispering) There you are.'},
    {speaker:'ANN',text:"I'm right here, Papa. I never left. Not really."},
    {speaker:'HERNANDO',text:"I forgot your laugh. I forgot your birthday. I forgot everything."},
    {speaker:'ANN',text:"I know. It's okay."},
    {speaker:'HERNANDO',text:"It's not okay. I forgot my own daughter."},
    {speaker:'ANN',text:"You also spent three years in a dark basement trying to bring me home. So I think we're even."},
    {speaker:'NARRATION',text:'Hernando laughs. Just once. Short and broken. But real.'},
    {speaker:'ELIAS',text:'(quietly) There it is.'},
    {speaker:'ANN',text:'What?'},
    {speaker:'ELIAS',text:"Papa's laugh. I forgot what it sounded like too."},
  ],function(){setPuzzle(pBtn('&#9658; EPILOGUE','showEnding()'));});
}

function showEnding(){
  showScreen('scrEnding');
  var el=qs('endTxt');el.innerHTML='';
  var wrap=qs('endWrap');
  var cols={ELIAS:'text-candle',HERNANDO:'text-pink-300/80',ANN:'text-emerald-300/80'};
  var i=0;
  var iv=setInterval(function(){
    if(i>=ELINES.length){
      clearInterval(iv);
      var fin=ce('div','mt-14');
      fin.innerHTML='<div class="font-title text-candle text-3xl tracking-[0.35em] mb-8">— END —</div>'
        +'<div class="flex gap-4 justify-center"><button onclick="restartGame()" class="font-title text-candle border border-candle/35 px-10 py-3 tracking-[0.3em] uppercase text-sm hover:bg-candle/10 hover:border-candle transition-all duration-300">PLAY AGAIN</button></div>';
      wrap.appendChild(fin);spawnFireflies();return;
    }
    var line=ELINES[i];var p=ce('p');
    if(line.t==='g'){p.innerHTML='&nbsp;';}
    else if(line.t==='n'){p.className='font-body italic text-white/95 text-base leading-loose mb-0';p.textContent=line.v;}
    else{var c=cols[line.s]||'text-candle';p.innerHTML='<span class="font-title text-sm '+c+' tracking-wider">'+line.s+':</span><span class="font-body text-white/95 text-base"> '+line.v+'</span>';}
    el.appendChild(p);wrap.scrollTop=wrap.scrollHeight;i++;
  },640);
}
function spawnFireflies(){
  for(var k=0;k<5;k++){
    (function(delay){
      setTimeout(function(){
        var ff=ce('div');
        ff.style.cssText='position:fixed;width:4px;height:4px;border-radius:50%;background:rgba(200,220,95,0.9);box-shadow:0 0 8px rgba(200,220,95,0.7);pointer-events:none;z-index:99;left:'+(18+Math.random()*64)+'%;top:'+(18+Math.random()*64)+'%;animation:fly '+(6+Math.random()*4)+'s ease-in-out forwards;';
        document.body.appendChild(ff);setTimeout(function(){ff.remove();},11000);
      },delay);
    })(k*1100);
  }
}
